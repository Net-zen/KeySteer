name: Set up release Rust
description: Resolve official stable Rust, install targets, and synchronize the package lockfile
inputs:
  targets:
    description: Comma-separated Rust targets; omit when only host tools are needed
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve latest stable Rust
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        rust_version="$(gh api repos/rust-lang/rust/releases/latest --jq '.tag_name')"
        [[ "$rust_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
        echo "RUSTUP_CACHE_HOME=$(rustup show home)" >> "$GITHUB_ENV"
        echo "RUST_TARGETS_KEY=${RUST_TARGETS//,/-}" >> "$GITHUB_ENV"

    - name: Restore Rust toolchain
      id: toolchain-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.RUSTUP_CACHE_HOME }}/toolchains/${{ env.RUSTUP_TOOLCHAIN }}-*
        key: rust-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.RUST_TARGETS_KEY }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        targets: ${{ inputs.targets }}

    - name: Save Rust toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.RUSTUP_CACHE_HOME }}/toolchains/${{ env.RUSTUP_TOOLCHAIN }}-*
        key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

    - name: Identify third-party dependency downloads
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, json, os, pathlib, tomllib
        lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text(encoding='utf-8'))
        # Local package versions, manifests, source files and compiler flags
        # must not multiply the cache of platform-independent downloads.
        packages = [p for p in lock['package'] if 'source' in p]
        packages.sort(key=lambda p: (p['name'], p['version'], p['source']))
        digest = hashlib.sha256(json.dumps(packages, sort_keys=True).encode()).hexdigest()
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'CARGO_DOWNLOAD_KEY={digest}\n')
        PY

    - name: Restore Cargo downloads
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v2-cargo-downloads
        shared-key: ${{ env.CARGO_DOWNLOAD_KEY }}
        add-rust-environment-hash-key: false
        cache-targets: false
        cache-bin: false
        cache-workspace-crates: false
        cache-on-failure: true

    - name: Prepare build date and lockfile
      shell: bash
      run: |
        echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
        version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
        test -n "$version"
        locked_version="$(awk '/^name = "keysteer"\r?$/ { found=1; next } found && /^version = / { gsub(/["\r]/, "", $3); print $3; exit }' Cargo.lock)"
        if [[ "$locked_version" != "$version" ]]; then
          cargo update --package keysteer --precise "$version"
        fi
