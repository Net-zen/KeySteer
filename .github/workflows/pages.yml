name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Download release tag (latest = latest stable release)'
        type: string
        required: false
        default: latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pages:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Keep the Pages toolchain stable across GitHub's ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          with open('package.json') as source:
              manager = json.load(source)['packageManager']
          match = re.fullmatch(r'pnpm@([0-9]+\.[0-9]+\.[0-9]+)(?:\+.*)?', manager)
          if not match:
              raise SystemExit('Expected an exact pnpm version in package.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match[1]}\n')
          PYTHON

      - name: Restore pnpm tool
        id: pnpm-tool
        uses: actions/cache@v6
        with:
          # Cache the package manager only, not project node_modules or output.
          path: ~/.cache/keysteer-pnpm
          key: pages-pnpm-tool-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

      - name: Set up pnpm
        if: steps.pnpm-tool.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          dest: ~/.cache/keysteer-pnpm

      - name: Activate pnpm tool
        run: |
          pnpm_home="$HOME/.cache/keysteer-pnpm/node_modules/.bin"
          echo "PNPM_HOME=$pnpm_home" >> "$GITHUB_ENV"
          echo "$pnpm_home" >> "$GITHUB_PATH"
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          EXPECTED_PNPM: ${{ steps.pnpm-version.outputs.version }}
        run: |
          test "$(pnpm --version)" = "$EXPECTED_PNPM"
          pnpm install --frozen-lockfile --prefer-offline

      - name: Test documentation models
        run: pnpm docs:test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build VitePress site
        env:
          KEYSTEER_DOCS_BASE: /KeySteer/
          KEYSTEER_DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm docs:build

      # upload-pages-artifact@v4 internally uses the Node 20 upload action.
      # Package the documented Pages artifact directly so every action here
      # uses a Node 24 runtime.
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/.vitepress/dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
