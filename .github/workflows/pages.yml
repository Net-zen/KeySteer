name: Pages
run-name: Pages · ${{ inputs.release_tag }}

on:
  # Build calls Pages from the default branch and waits for deployment.
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: latest
      entry_run_id:
        type: string
        default: ''
      entry_sha:
        type: string
        default: ''
      stage_results:
        type: string
        default: '{}'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Download release tag (latest = latest stable release)'
        type: string
        required: false
        default: latest

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pages:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Keep the Pages toolchain stable across GitHub's ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve latest stable pnpm
        id: pnpm-version
        run: |
          python3 - <<'PYTHON'
          import json, os, re, urllib.request
          with urllib.request.urlopen('https://registry.npmjs.org/pnpm/latest', timeout=30) as response:
              version = json.load(response)['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a stable pnpm version from the npm registry')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON

      - name: Restore pnpm tool
        id: pnpm-tool
        uses: actions/cache/restore@v6
        with:
          # Cache the package manager only, not project node_modules or output.
          path: ~/.cache/keysteer-pnpm
          key: pages-pnpm-tool-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

      - name: Set up pnpm
        if: steps.pnpm-tool.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ~/.cache/keysteer-pnpm

      - name: Activate pnpm tool
        run: |
          pnpm_home="$HOME/.cache/keysteer-pnpm/node_modules/.bin"
          echo "PNPM_HOME=$pnpm_home" >> "$GITHUB_ENV"
          echo "$pnpm_home" >> "$GITHUB_PATH"
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"

      # pnpm puts its store under PNPM_HOME. Save the tool before setup-node
      # restores that store, otherwise both caches contain project dependencies.
      - name: Save pnpm tool
        if: steps.pnpm-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/keysteer-pnpm
          key: ${{ steps.pnpm-tool.outputs.cache-primary-key }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          EXPECTED_PNPM: ${{ steps.pnpm-version.outputs.version }}
        run: |
          test "$(pnpm --version)" = "$EXPECTED_PNPM"
          pnpm install --frozen-lockfile --prefer-offline

      - name: Test documentation models
        run: pnpm docs:test

      - name: Build VitePress site
        env:
          GITHUB_PAGES: 'true'
          KEYSTEER_DOCS_BASE: /KeySteer/
          KEYSTEER_DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm docs:build

      # upload-pages-artifact@v4 internally uses the Node 20 upload action.
      # Package the documented Pages artifact directly so every action here
      # uses a Node 24 runtime.
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/.vitepress/dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Confirm short deployments sooner; the action still backs off polling.
          reporting_interval: '1000'

      # Reuse the deployment runner; never allocate a cleanup-only runner.
      - name: Clean unused caches
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_MAX_IDLE_DAYS: ${{ vars.ACTIONS_CACHE_MAX_IDLE_DAYS }}
        run: python3 .github/scripts/cleanup_caches.py

      - name: Clean entry
        if: ${{ inputs.entry_run_id != '' && steps.deployment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_RUN_ID: ${{ inputs.entry_run_id }}
          ENTRY_SHA: ${{ inputs.entry_sha }}
          STAGE_RESULTS: ${{ inputs.stage_results }}
          PAGES_RESULT: ${{ steps.deployment.outcome }}
        run: python3 .github/scripts/cleanup_entry.py
