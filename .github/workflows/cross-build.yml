name: Package Windows on Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
            cpu: native
            cl_flags: /clang:-march=native
          - arch: ARM64
            target: aarch64-pc-windows-msvc
            xwin_arch: aarch64
            cpu: generic
            cl_flags: ""
    env:
      KEYSTEER_CROSS_WINDOWS: "1"
      # Optimize x64 for the actual runner CPU. ARM64 is cross-compiled on an
      # x64 runner, so it must retain an architecture-appropriate generic CPU.
      RUSTFLAGS: -C link-arg=/Brepro -C target-cpu=${{ matrix.cpu }}
      RC_PATH: llvm-rc
      # winresource probes a GNU prefix even for MSVC; bypass the misleading
      # ARM64 warning. MSVC resources are still compiled with RC_PATH above.
      CROSS_COMPILE: ""
      XWIN_ARCH: ${{ matrix.xwin_arch }}
    steps:
      - name: Initialize runtime cache path
        # runner context is unavailable in job-level env. RUNNER_TEMP exists
        # once the runner starts, and GITHUB_ENV exposes this to later steps.
        run: echo "XWIN_CACHE_DIR=$RUNNER_TEMP/keysteer-xwin" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve latest stable LLVM
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/llvm/llvm-project/releases/latest > "$RUNNER_TEMP/llvm-release.json"
          python3 - <<'PY'
          import json, os, pathlib, re
          release = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "llvm-release.json").read_text())
          match = re.fullmatch(r"llvmorg-([0-9]+\.[0-9]+\.[0-9]+)", release["tag_name"])
          if not match or release["prerelease"] or release["draft"]:
              raise SystemExit("Expected an official stable LLVM release")
          version = match[1]
          # Both jobs execute on an x64 Linux host, including the ARM64 cross build.
          names = [f"LLVM-{version}-Linux-X64.tar.{extension}" for extension in ("zst", "xz")]
          assets = {asset["name"]: asset for asset in release["assets"]}
          asset = next((assets[name] for name in names if name in assets), None)
          if asset is None:
              raise SystemExit("Latest LLVM release has no Linux X64 toolchain archive")
          digest = asset.get("digest") or ""
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("LLVM release asset has no SHA256 digest")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"LLVM_VERSION={version}\nLLVM_TAG={release['tag_name']}\nLLVM_ASSET={asset['name']}\nLLVM_SHA256={digest[7:]}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"llvm-sha256={digest[7:]}\n")
          print(f"Selected {asset['name']} ({digest})")
          PY
      - name: Resolve latest stable cargo-xwin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xwin_tag="$(gh api repos/rust-cross/cargo-xwin/releases/latest --jq '.tag_name')"
          xwin_version="${xwin_tag#v}"
          [[ "$xwin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "CARGO_XWIN_VERSION=$xwin_version" >> "$GITHUB_ENV"
          echo "Selected cargo-xwin $xwin_version from rust-cross/cargo-xwin"

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Identify CPU for the build cache
        id: cpu
        env:
          CPU_MODE: ${{ matrix.cpu }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          cache_key = "generic"
          if os.environ["CPU_MODE"] == "native":
              # Runner hardware can change without a toolchain or flags change.
              # Separate caches to avoid reusing code for another instruction set.
              block = pathlib.Path("/proc/cpuinfo").read_text().split("\n\n", 1)[0]
              fields = dict(line.split(":", 1) for line in block.splitlines() if ":" in line)
              fields = {key.strip(): value.strip() for key, value in fields.items()}
              identity = {key: fields[key] for key in ("vendor_id", "cpu family", "model", "model name", "stepping", "flags")}
              identity["flags"] = " ".join(sorted(identity["flags"].split()))
              encoded = json.dumps(identity, sort_keys=True)
              print(encoded)
              cache_key = hashlib.sha256(encoded.encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key={cache_key}\n")
          PY

      - name: Resolve system package versions
        id: system-packages
        run: |
          sudo apt-get update
          package_key="$(apt-cache policy osslsigncode zip zstd libtinfo6 libxml2 libzstd1 libedit2 | sha256sum | cut -d ' ' -f 1)"
          echo "apt-key=$package_key" >> "$GITHUB_OUTPUT"

      - name: Restore system package downloads
        uses: actions/cache@v6
        with:
          # Share downloads across targets, excluding apt locks and partial files.
          path: ${{ runner.temp }}/keysteer-apt/*.deb
          key: cross-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.system-packages.outputs.apt-key }}
          restore-keys: cross-apt-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system tools
        run: |
          mkdir -p "$RUNNER_TEMP/keysteer-apt/partial"
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/keysteer-apt" \
            -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            osslsigncode zip zstd libtinfo6 libxml2 libzstd1 libedit2

      - name: Restore official LLVM download
        id: llvm-cache
        uses: actions/cache@v6
        with:
          # Shared by target architectures: this is a Linux host toolchain.
          path: ~/.cache/keysteer-llvm-downloads
          key: llvm-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.llvm-sha256 }}

      - name: Download official LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.cache/keysteer-llvm-downloads"
          gh release download "$LLVM_TAG" --repo llvm/llvm-project \
            --pattern "$LLVM_ASSET" --dir "$HOME/.cache/keysteer-llvm-downloads"

      - name: Verify and extract LLVM
        run: |
          archive="$HOME/.cache/keysteer-llvm-downloads/$LLVM_ASSET"
          printf '%s  %s\n' "$LLVM_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/keysteer-llvm"
          case "$LLVM_ASSET" in
            *.tar.zst)
              # Official LLVM archives can use a 1 GiB zstd window, exceeding
              # the decoder's default 128 MiB limit. Stream without an extra tar.
              zstd --decompress --stdout --long=30 "$archive" \
                | tar -xf - --strip-components=1 -C "$RUNNER_TEMP/keysteer-llvm"
              ;;
            *.tar.xz)
              tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/keysteer-llvm"
              ;;
            *) echo "Unsupported LLVM archive: $LLVM_ASSET" >&2; exit 1 ;;
          esac
          for tool in clang-cl lld-link llvm-lib llvm-rc; do
            test -x "$RUNNER_TEMP/keysteer-llvm/bin/$tool"
          done
          "$RUNNER_TEMP/keysteer-llvm/bin/clang-cl" --version
          "$RUNNER_TEMP/keysteer-llvm/bin/lld-link" --version
          echo "$RUNNER_TEMP/keysteer-llvm/bin" >> "$GITHUB_PATH"

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-cross-windows-experiment
          key: ${{ matrix.target }}-${{ matrix.cpu }}-${{ steps.cpu.outputs.key }}-llvm${{ steps.tools.outputs.llvm-sha256 }}-xwin${{ env.CARGO_XWIN_VERSION }}-release
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Restore cargo-xwin executable
        id: xwin-tool
        uses: actions/cache@v6
        with:
          # One host executable serves both Windows target architectures.
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-prebuilt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Install cargo-xwin
        if: steps.xwin-tool.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}
          # Use checked upstream binaries; never fall back to a third-party
          # binary provider or an unexpected source build.
          fallback: none

      - name: Restore Windows SDK and CRT
        uses: actions/cache@v6
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-sdk-v1-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}-${{ matrix.target }}

      - name: Build complete Windows executable
        env:
          # cargo-xwin merges CL_FLAGS into its generated target CFLAGS.
          CL_FLAGS: ${{ matrix.cl_flags }}
        run: |
          rustc -Vv
          clang-cl --version
          lld-link --version
          cargo xwin --version
          cargo xwin build --locked --release --bin keysteer --no-default-features --target ${{ matrix.target }}

      - name: Sign and package Windows executable
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          KEYSTEER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          KEYSTEER_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: bash packaging/windows/package-cross.sh ${{ matrix.target }}

      - name: Summarize signed package
        env:
          TARGET: ${{ matrix.target }}
          COMPILE_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          {
            echo "### Windows $TARGET"
            echo "Rust compilation cache hit: ${COMPILE_CACHE_HIT:-false}"
            echo 'Signed with the existing Windows certificate and an RFC 3161 timestamp.'
            echo 'Native UI behavior still requires Windows validation.'
            echo 'SHA256 of the signed executable and package:'
            echo '```text'
            cd "dist/$TARGET"
            sha256sum KeySteer/KeySteer.exe ./*.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: KeySteer-Windows-${{ matrix.arch }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
