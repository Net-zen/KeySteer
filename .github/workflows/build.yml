name: Build
run-name: ${{ (github.event_name == 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) && 'Start' || 'Build' }} · ${{ inputs.build_mode || 'cross' }} · ${{ inputs.release_tag || inputs.source_sha || github.ref_name }}

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: Compilation method
        required: true
        default: cross
        type: choice
        options:
          - cross
          - native
      platform:
        description: Packages to build
        required: true
        default: all
        type: choice
        options:
          - windows
          - macos
          - all
      publish:
        description: Publish the packages as a GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release
      release_tag:
        description: Existing release tag (empty = derive from package version)
        required: false
        default: ''
        type: string
      source_sha:
        description: Source commit (empty = selected ref)
        required: false
        default: ''
        type: string
      entry_run_id:
        description: Entry run to remove after success (empty = retain all runs)
        required: false
        default: ''
        type: string
      entry_sha:
        description: Commit recorded by the entry run
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.publish && 'publish' || github.ref) || format('entry-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  source:
    name: Prepare
    if: ${{ !github.event.deleted }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build_mode: ${{ steps.source.outputs.build_mode }}
    steps:
      - name: Forward entry to the default branch
        if: ${{ github.event_name == 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_MODE: ${{ inputs.build_mode || 'cross' }}
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          BUILD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_TYPE: ${{ inputs.release_type || 'release' }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha || (inputs.release_tag == '' && github.sha) || '' }}
        run: |
          test -n "$BUILD_BRANCH"
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BUILD_BRANCH" \
            --raw-field "build_mode=$BUILD_MODE" \
            --raw-field "platform=$BUILD_PLATFORM" \
            --raw-field "publish=$BUILD_PUBLISH" \
            --raw-field "release_type=$RELEASE_TYPE" \
            --raw-field "release_tag=$RELEASE_TAG" \
            --raw-field "source_sha=$SOURCE_SHA" \
            --raw-field "entry_run_id=$GITHUB_RUN_ID" \
            --raw-field "entry_sha=$GITHUB_SHA"

      - name: Checkout source
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Validate release source
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            test "$tag_sha" = "$source_sha"
            # Tags are releases of commits already present on the default branch.
            git merge-base --is-ancestor "$source_sha" "refs/remotes/origin/$BUILD_BRANCH"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"

  windows:
    needs: source
    if: ${{ needs.source.outputs.sha != '' && needs.source.outputs.build_mode == 'cross' && (inputs.publish || inputs.platform == 'windows' || inputs.platform == 'all') }}
    # Static names also render correctly when the job is skipped before expansion.
    name: Cross Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [x64 compatible, x64 avx2, x64 avx512, ARM64]
        include:
          - build: x64 compatible
            arch: x64
            variant: compatible
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
            cpu: x86-64
            cl_flags: /clang:-march=x86-64
            artifact: KeySteer-Windows-x64-Compatible
          - build: x64 avx2
            arch: x64
            variant: avx2
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
            cpu: x86-64-v3
            cl_flags: /clang:-march=x86-64-v3
            artifact: KeySteer-Windows-x64
          - build: x64 avx512
            arch: x64
            variant: avx512
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
            cpu: x86-64-v4
            cl_flags: /clang:-march=x86-64-v4
            artifact: KeySteer-Windows-x64-AVX512
          - build: ARM64
            arch: ARM64
            target: aarch64-pc-windows-msvc
            xwin_arch: aarch64
            cpu: generic
            cl_flags: ""
            artifact: KeySteer-Windows-ARM64
    env:
      KEYSTEER_CROSS_WINDOWS: "1"
      # Pin every x64 instruction-set level; runner CPU changes must never
      # silently change the requirements of any published package.
      # ARM64 retains its architecture-appropriate generic CPU.
      RUSTFLAGS: -C link-arg=/Brepro -C target-cpu=${{ matrix.cpu }}
      RC_PATH: llvm-rc
      # winresource probes a GNU prefix even for MSVC; bypass the misleading
      # ARM64 warning. MSVC resources are still compiled with RC_PATH above.
      CROSS_COMPILE: ""
      XWIN_ARCH: ${{ matrix.xwin_arch }}
    steps:
      - name: Initialize runtime cache path
        # runner context is unavailable in job-level env. RUNNER_TEMP exists
        # once the runner starts, and GITHUB_ENV exposes this to later steps.
        run: echo "XWIN_CACHE_DIR=$RUNNER_TEMP/keysteer-xwin" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Resolve latest stable cargo-xwin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xwin_tag="$(gh api repos/rust-cross/cargo-xwin/releases/latest --jq '.tag_name')"
          xwin_version="${xwin_tag#v}"
          [[ "$xwin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "CARGO_XWIN_VERSION=$xwin_version" >> "$GITHUB_ENV"
          echo "Selected cargo-xwin $xwin_version from rust-cross/cargo-xwin"

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up LLVM and system tools
        uses: ./.github/actions/setup-llvm
        with:
          windows-tools: 'true'

      - name: Restore cargo-xwin executable
        id: xwin-tool
        uses: actions/cache@v6
        with:
          # One host executable serves both Windows target architectures.
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-prebuilt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Install cargo-xwin
        if: steps.xwin-tool.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}
          # Use checked upstream binaries; never fall back to a third-party
          # binary provider or an unexpected source build.
          fallback: none

      - name: Restore Windows SDK and CRT
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-sdk-v1-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}-${{ matrix.target }}

      - name: Prepare Windows SDK and CRT
        timeout-minutes: 15
        run: cargo xwin cache xwin

      - name: Save Windows SDK and CRT
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Build complete Windows executable
        env:
          # cargo-xwin merges CL_FLAGS into its generated target CFLAGS.
          CL_FLAGS: ${{ matrix.cl_flags }}
        run: |
          rustc -Vv
          clang-cl --version
          lld-link --version
          cargo xwin --version
          cargo xwin build --locked --release --bin keysteer --no-default-features --target ${{ matrix.target }}

      - name: Sign and package Windows executable
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          KEYSTEER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          KEYSTEER_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: bash packaging/windows/package-cross.sh ${{ matrix.target }} ${{ matrix.variant }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    needs: source
    if: ${{ needs.source.outputs.sha != '' && needs.source.outputs.build_mode == 'cross' && (inputs.publish || inputs.platform == 'macos' || inputs.platform == 'all') }}
    name: Cross macOS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [Apple Silicon, Intel]
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
            artifact: KeySteer-macOS-Apple-Silicon
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: KeySteer-macOS-Intel
    env:
      KEYSTEER_CROSS_MACOS: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Resolve SDK source
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SDK_URL: ${{ vars.MACOS_SDK_URL }}
          MACOS_SDK_SHA256: ${{ vars.MACOS_SDK_SHA256 }}
        run: python3 packaging/macos/resolve-sdk.py

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up LLVM and system tools
        uses: ./.github/actions/setup-llvm

      - name: Initialize SDK path
        run: echo "MACOS_SDK_DIR=$RUNNER_TEMP/keysteer-macos-sdk" >> "$GITHUB_ENV"

      - name: Restore Apple SDK
        id: apple-sdk
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MACOS_SDK_DIR }}
          key: macos-sdk-v1-Linux-${{ steps.sdk.outputs.sha256 }}

      - name: Download and extract Apple SDK
        if: steps.apple-sdk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SDK_URL: ${{ steps.sdk.outputs.url }}
          MACOS_SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
          MACOS_SDK_TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          archive="$RUNNER_TEMP/macos-sdk.tar"
          if [[ -n "$MACOS_SDK_TAG" ]]; then
            gh release download "$MACOS_SDK_TAG" --repo joseluisq/macosx-sdks \
              --pattern "MacOSX$MACOS_SDK_TAG.sdk.tar.xz" --output "$archive"
          else
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --retry 3 --connect-timeout 30 --max-time 900 "$MACOS_SDK_URL" -o "$archive"
          fi
          printf '%s  %s\n' "$MACOS_SDK_SHA256" "$archive" | sha256sum --check --strict
          python3 packaging/macos/prepare-sdk.py "$archive"

      - name: Activate Apple SDK
        run: python3 packaging/macos/prepare-sdk.py

      - name: Save Apple SDK
        if: steps.apple-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MACOS_SDK_DIR }}
          key: ${{ steps.apple-sdk.outputs.cache-primary-key }}

      - name: Configure macOS compiler and linker
        run: bash packaging/macos/configure-cross.sh ${{ matrix.target }}

      - name: Build complete macOS executable
        run: cargo build --locked --release --bin keysteer --no-default-features --target ${{ matrix.target }}

      - name: Set up macOS signing tool
        uses: ./.github/actions/setup-rcodesign

      - name: Sign and package macOS executable
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_NOTARY_KEY_JSON_BASE64: ${{ secrets.MACOS_NOTARY_KEY_JSON_BASE64 }}
        run: python3 packaging/macos/package-cross.py ${{ matrix.target }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  native-windows:
    needs: source
    name: Native Windows
    if: ${{ needs.source.outputs.sha != '' && needs.source.outputs.build_mode == 'native' && (inputs.publish || inputs.platform == 'windows' || inputs.platform == 'all') }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            artifact: KeySteer-Windows-x64
            package_args: ""
          - arch: ARM64
            target: aarch64-pc-windows-msvc
            artifact: KeySteer-Windows-ARM64
            package_args: -SkipConfigCheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is required for Windows release artifacts"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "keysteer-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )
          "KEYSTEER_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Windows ${{ matrix.arch }}
        shell: pwsh
        timeout-minutes: 30
        env:
          KEYSTEER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          KEYSTEER_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./packaging/windows/package.ps1 -Target ${{ matrix.target }} -RequireSigning ${{ matrix.package_args }}

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "keysteer-signing.pfx"
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }

      - name: Upload Windows ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  native-macos:
    needs: source
    name: Native macOS
    if: ${{ needs.source.outputs.sha != '' && needs.source.outputs.build_mode == 'native' && (inputs.publish || inputs.platform == 'macos' || inputs.platform == 'all') }}
    # Link against the current AppKit SDK so standard controls adopt macOS 26
    # styling. package.sh retains the macOS 14 deployment target.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [Apple Silicon, Intel]
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
            artifact: KeySteer-macOS-Apple-Silicon
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: KeySteer-macOS-Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        timeout-minutes: 30
        run: bash packaging/macos/package.sh ${{ matrix.target }}

      - name: Upload macOS ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Release
    if: >-
      ${{ !cancelled() && inputs.publish && needs.source.result == 'success' &&
          ((needs.source.outputs.build_mode == 'cross' && needs.windows.result == 'success' && needs.macos.result == 'success') ||
           (needs.source.outputs.build_mode == 'native' && needs.native-windows.result == 'success' && needs.native-macos.result == 'success')) }}
    needs: [source, windows, macos, native-windows, native-macos]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workflow-tools
          sparse-checkout: |
            .github/scripts
            packaging/package-managers
            Casks
            bucket

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: KeySteer-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PACKAGE_SET: ${{ needs.source.outputs.build_mode }}
          REPLACE_RELEASE: ${{ needs.source.outputs.build_mode == 'cross' }}
        run: python3 workflow-tools/.github/scripts/release.py

      - name: Generate manifests from the latest stable release
        working-directory: workflow-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag_name"])' "$RUNNER_TEMP/release.json")"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$RUNNER_TEMP/package-assets"
          python3 packaging/package-managers/generate.py "$RUNNER_TEMP/release.json" --assets-dir "$RUNNER_TEMP/package-assets"
          python3 -m unittest discover -s packaging/package-managers -p 'test_*.py'

      - name: Commit package manager metadata
        working-directory: workflow-tools
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add Casks/keysteer.rb bucket/keysteer.json
          if git diff --cached --quiet; then
            echo "Package manager manifests are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Homebrew and Scoop manifests'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

  pages:
    name: Pages
    needs: [source, windows, macos, native-windows, native-macos, release]
    if: >-
      ${{ !cancelled() &&
          needs.source.outputs.sha != '' &&
          (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.native-windows.result == 'success' || needs.native-macos.result == 'success') &&
          (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.native-windows.result == 'success' || needs.native-windows.result == 'skipped') &&
          (needs.native-macos.result == 'success' || needs.native-macos.result == 'skipped') &&
          (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release.outputs.tag || 'latest' }}
      entry_run_id: ${{ inputs.entry_run_id }}
      entry_sha: ${{ inputs.entry_sha }}
      stage_results: ${{ toJSON(needs) }}
