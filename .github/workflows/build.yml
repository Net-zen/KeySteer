name: Native
run-name: Native · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build
        required: true
        default: all
        type: choice
        options:
          - windows
          - macos
          - all
      publish:
        description: Publish the packages as a GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows ${{ matrix.arch }}
    if: ${{ inputs.publish || inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            artifact: KeySteer-Windows-x64
            package_args: ""
          - arch: ARM64
            target: aarch64-pc-windows-msvc
            artifact: KeySteer-Windows-ARM64
            package_args: -SkipConfigCheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is required for Windows release artifacts"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "keysteer-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )
          "KEYSTEER_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Windows ${{ matrix.arch }}
        shell: pwsh
        timeout-minutes: 30
        env:
          KEYSTEER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          KEYSTEER_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./packaging/windows/package.ps1 -Target ${{ matrix.target }} -RequireSigning ${{ matrix.package_args }}

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "keysteer-signing.pfx"
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }

      - name: Upload Windows ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: Package macOS ${{ matrix.arch }}
    if: ${{ inputs.publish || inputs.platform == 'macos' || inputs.platform == 'all' }}
    # Link against the current AppKit SDK so standard controls adopt macOS 26
    # styling. package.sh retains the macOS 14 deployment target.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
            artifact: KeySteer-macOS-Apple-Silicon
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: KeySteer-macOS-Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up release Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        timeout-minutes: 30
        run: bash packaging/macos/package.sh ${{ matrix.target }}

      - name: Upload macOS ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Release
    if: ${{ inputs.publish }}
    needs: [windows, macos]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workflow-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: KeySteer-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ''
          RELEASE_TYPE: ${{ inputs.release_type }}
          PACKAGE_SET: native
          REPLACE_RELEASE: 'false'
        run: python3 workflow-tools/.github/scripts/release.py

  package-managers:
    name: Packages
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/package-managers.yml
